<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            background-color: #0b3d1e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .header-text {
            text-align: center;
            margin-top: 30px;
            font-size: 18px;
            line-height: 1.6;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #1e5631;
            background-color: #000000;
            color: #ffffff;
            box-sizing: border-box;
            border-radius: 4px;
            font-size: 14px;
        }
        input::placeholder {
            color: #aaaaaa;
        }
        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #138038;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 4px;
        }
        .footer {
            font-size: 13px;
            color: #d1d1d1;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="header-text">
        أهلاً وسهلاً بك عزيزي الطالب<br>
        أنت تدرس تكنولوجيا المعلومات<br>
        هل هذا صحيح؟
    </div>

    <div class="login-container">
        <form>
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" placeholder="اسم المستخدم">
            </div>
            
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" placeholder="كلمة السر">
            </div>
            
            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>
    </div>

    <div class="footer">
        حقوق الطبع محفوظة للطالب مازن 2026م
    </div>

</body>
</html>
